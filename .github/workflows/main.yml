name: Build and Release EasyWalletTheme
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA (or set BASE_IPA_URL secret)"
        default: ""
        required: false
        type: string
      display_name:
        description: "App Name (Optional)"
        default: "Easy Wallet"
        required: true
        type: string
      bundle_id:
        description: "BundleID (Optional)"
        default: "tw.com.easycard.easycardwallet"
        required: true
        type: string

env:
  IPA_URL: ${{ inputs.ipa_url || secrets.BASE_IPA_URL }}
  DISPLAY_NAME: ${{ inputs.display_name || 'Easy Wallet' }}
  BUNDLE_ID: ${{ inputs.bundle_id || 'tw.com.easycard.easycardwallet' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EasyWalletTheme
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Validate IPA URL
        run: |
          if [ -z "${{ env.IPA_URL }}" ]; then
            echo "::error::No base IPA URL. Pass ipa_url at dispatch or set BASE_IPA_URL secret."
            exit 1
          fi
          curl -L -r 0-1023 -o sample.part "${{ env.IPA_URL }}" > /dev/null 2>&1
          file_type=$(file --mime-type -b sample.part)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA. Detected: $file_type"
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download base IPA
        run: wget "${{ env.IPA_URL }}" --no-verbose -O base.ipa

      - name: Build Tweak for Sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          mv packages/*.deb ../ewtheme.deb

      - name: Inject tweak into IPA
        run: cyan -i base.ipa -o EasyWalletTheme.ipa -uwsf ewtheme.deb -n "${{ env.DISPLAY_NAME }}" -b ${{ env.BUNDLE_ID }}

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: build-${{ github.run_number }}
          name: EasyWalletTheme (Build ${{ github.run_number }})
          files: EasyWalletTheme.ipa
          draft: false
          body: |
            EasyWalletTheme build #${{ github.run_number }}

            - App Name: `${{ env.DISPLAY_NAME }}`
            - Bundle: `${{ env.BUNDLE_ID }}`
            - Base: Easy Wallet 3.1.36 (decrypted IPA via BASE_IPA_URL)

      - name: Output Release URL
        run: |
          echo "::notice::Release at https://github.com/${{ github.repository }}/releases"
