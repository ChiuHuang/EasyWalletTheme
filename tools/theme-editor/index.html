<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyWalletTheme Editor</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input[type=color] { width: 64px; height: 40px; }
  #preview { margin-top: 20px; border-radius: 12px; overflow: hidden; border: 1px solid #ccc; }
  #previewNav { padding: 12px; color: #fff; font-weight: 700; }
  #previewBody { height: 160px; background-size: cover; background-position: center; padding: 12px; }
  #previewTab { display: flex; justify-content: space-around; padding: 10px; }
  button { margin-top: 12px; padding: 10px 16px; }
  pre { background: #f4f4f4; padding: 12px; overflow-x: auto; }
</style>
</head>
<body>
<h1>EasyWalletTheme Editor</h1>
<p>調色 + 背景圖，匯出後丟進 App 即可預覽。v1 不需重編。</p>

<label>Accent 色</label>
<input type="color" id="accent" value="#22c55e">

<label>NavBar 背景（留白 = 跟隨系統）</label>
<input type="color" id="navbar" value="#111827">

<label>TabBar 背景（留白 = 跟隨系統）</label>
<input type="color" id="tabbar" value="#111827">

<label>自訂背景圖（PNG，會存成 Documents/EWTheme/bg.png）</label>
<input type="file" id="bgfile" accept="image/png,image/jpeg">

<div id="preview">
  <div id="previewNav">Easy Wallet</div>
  <div id="previewBody"><button id="previewBtn">範例按鈕</button></div>
  <div id="previewTab"><span>首頁</span><span>票卡</span><span>我的</span></div>
</div>

<button id="exportPlist">匯出 NSUserDefaults plist 片段</button>
<pre id="out"></pre>

<script>
const $ = id => document.getElementById(id);
let bgDataURL = null;
function refresh() {
  $('previewNav').style.background = $('navbar').value;
  $('previewTab').style.background = $('tabbar').value;
  $('previewBtn').style.background = $('accent').value;
  $('previewBtn').style.color = '#fff';
  if (bgDataURL) $('previewBody').style.backgroundImage = `url(${bgDataURL})`;
}
['accent','navbar','tabbar'].forEach(id => $(id).addEventListener('input', refresh));
$('bgfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { bgDataURL = r.result; refresh(); };
  r.readAsDataURL(f);
});
$('exportPlist').addEventListener('click', () => {
  const dict = {
    enabled: true,
    accentHex: $('accent').value,
    navBarHex: $('navbar').value,
    tabBarHex: $('tabbar').value
  };
  $('out').textContent =
    '<!-- defaults write tw.com.easycard.easycardwallet EasyWalletTheme \'' +
    JSON.stringify(dict) + '\' -->\n' +
    JSON.stringify(dict, null, 2) +
    '\n\n背景圖: 請把選擇的圖片存成 bg.png 放到 App 的 Documents/EWTheme/ 下 (Filza / 側載包內預置)。';
});
refresh();
</script>
</body>
</html>
